[package]
name = "defcmd"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "A command is a plain function marked #[command]; its signature is the CLI, modelled on nushell."
repository = "https://github.com/mdaffin/defcmd"
readme = "../README.md"
keywords = ["cli", "command-line", "nushell", "arguments", "macro"]
categories = ["command-line-interface"]
# Edition 2024 needs 1.85; not tested against an older toolchain.
rust-version = "1.85"

[dependencies]
defcmd-macros = { path = "../defcmd-macros", version = "0.1.0" }
inventory = "0.3"


# `CARGO_BIN_NAME` names the program in help output, and the example's docs call it `conf`.
[[example]]
name = "conf"
path = "examples/errors.rs"

# Same for `todo`, the program name in `examples/nushell_style.rs`.
[[example]]
name = "todo"
path = "examples/nushell_style.rs"

# And `copy` for `examples/flags_and_arguments.rs`.
[[example]]
name = "copy"
path = "examples/flags_and_arguments.rs"

# And `fetch` for `examples/values.rs`.
[[example]]
name = "fetch"
path = "examples/values.rs"

# A deliberately invalid tree, run by `tests/examples.rs` to see start-up validation panic.
[[example]]
name = "clashing"
path = "tests/fixtures/clashing.rs"

[lints.rust]
# `examples/values.rs` is verbatim: rustc ignores the derived `Debug` read of `Percent(u8)`.
dead_code = "allow"

[lints.clippy]
# `examples/errors.rs` is a verbatim copy of the documented example, which is not edited.
doc_overindented_list_items = "allow"
doc_lazy_continuation = "allow"
# A command's signature is its CLI, so commands (and `examples/flags_and_arguments.rs`) can have many.
too_many_arguments = "allow"

[dev-dependencies]
trybuild = "1.0.122"
