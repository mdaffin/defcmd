[package]
name = "defcmd"
version = "0.1.0"
edition = "2024"
license = "MIT"

[dependencies]
defcmd-macros = { path = "../defcmd-macros" }
inventory = "0.3"


# `CARGO_BIN_NAME` names the program in help output, and the example's docs call it `conf`.
[[example]]
name = "conf"
path = "examples/errors.rs"

# Same for `todo`, the program name in `examples/nushell_style.rs`.
[[example]]
name = "todo"
path = "examples/nushell_style.rs"

[lints.clippy]
# `examples/errors.rs` is a verbatim copy of the documented example, which is not edited.
doc_overindented_list_items = "allow"
# A command's signature is its CLI, so commands (and `examples/flags_and_arguments.rs`) can have many.
too_many_arguments = "allow"
