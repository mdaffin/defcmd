name: Publish

# Publishing a crate version is irreversible and can't be undone. Keep it an
# explicit, one-at-a-time action so accidental publishes are impossible.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Explicit next version to publish (e.g. 0.2.0). Empty = auto-bump from the last tag."
        required: false
      bump:
        description: "Bump amount when `version` is left empty."
        required: false
        type: choice
        options: [patch, minor, major]
        default: minor

permissions:
  contents: write   # create the GitHub release (tag is pushed by cargo-release)

jobs:
  publish:
    name: Prepare & publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # cargo-release needs a clean tree + full history (to reach origin/main and read tags)
          fetch-depth: 0
          # main is protected: push through a writable deploy key that bypasses the ruleset
          ssh-key: ${{ secrets.DEPLOY_KEY }}

      - uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-release
        run: cargo install --locked cargo-release

      # cargo-release takes the explicit version input *or* a bump level
      # (patch/minor/major) and computes the next version from the last tag
      # itself. With a v0.1.0 baseline tag a patch bump yields 0.1.1, so no
      # manual semver parsing is needed.
      - name: Release
        run: cargo release "${{ inputs.version || inputs.bump || 'minor' }}" --workspace --execute --no-confirm

      - name: Get the tag cargo-release pushed
        id: tag
        run: echo "tag=$(git describe --tags --abbrev=0)" >> "$GITHUB_OUTPUT"

      - name: Create GitHub release (after publish succeeds)
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          generate_release_notes: true
          make_latest: true
